def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}
def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) { 
    throw new GradleException("Flutter SDK not found.") 
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '9'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '9.0.0'

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace = "com.ludo.premium"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion
    
    compileOptions { 
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8 
    }
    
    kotlinOptions { 
        jvmTarget = '1.8' 
    }
    
    sourceSets { 
        main.java.srcDirs += 'src/main/kotlin' 
    }
    
    defaultConfig {
        applicationId = "com.ludo.premium"
        minSdk = 21
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
    }
    
    buildTypes { 
        release { 
            signingConfig = signingConfigs.debug
            // ===== SECURITY: Anti-Hack Protection =====
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Obfuscation + Shrinking for hack protection
            // Firebase & Agora are kept via proguard-rules.pro
        } 
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }
    
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }
}

flutter { 
    source = '../..' 
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
