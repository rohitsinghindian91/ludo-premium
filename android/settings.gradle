include ':app'

def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
def properties = new Properties()

assert localPropertiesFile.exists()
localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }

def flutterSdkPath = properties.getProperty("flutter.sdk")
assert flutterSdkPath != null, "flutter.sdk not set in local.properties or not set correctly
It should be set in the local.properties file and should point to the location where you have downloaded the Flutter SDK"
assert new File(flutterSdkPath).exists(), "flutter.sdk in local.properties points to a directory that does not exist.  Edit local.properties to point to the Flutter SDK directory."

def flutterEl = { File f -> f != null && f.exists() } 

apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
