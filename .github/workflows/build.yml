name: Build APK - Final
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter clean
      - run: flutter pub get
      - name: Generate App Icons from assets/icon.png
        run: dart run flutter_launcher_icons
      - name: Fix gal 2.3.3 - DIRECT PATH
        run: |
          FILE="/home/runner/.pub-cache/hosted/pub.dev/gal-2.3.3/android/build.gradle"
          echo "Fixing $FILE"
          ls -l "$FILE"
          cat > "$FILE" << 'EOF'
          group 'studio.midoridesign.gal'
          version '1.0'
          buildscript {
              ext.kotlin_version = '1.9.10'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'
          android {
              namespace 'studio.midoridesign.gal'
              compileSdk 34
              compileSdkVersion 34
              defaultConfig {
                  minSdk 21
                  minSdkVersion 21
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          dependencies {
              implementation 'org.apache.commons:commons-imaging:1.0-alpha3'
              implementation 'androidx.exifinterface:exifinterface:1.3.6'
          }
          EOF
          cat "$FILE"
          MANIFEST="/home/runner/.pub-cache/hosted/pub.dev/gal-2.3.3/android/src/main/AndroidManifest.xml"
          sed -i 's/package="studio.midoridesign.gal"//g' "$MANIFEST" || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
