name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: flutter clean
        run: flutter clean

      - name: flutter pub get
        run: flutter pub get

      - name: Fix icon crash - delete broken xml
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          echo "Copying assets/icon.png to mipmap as ic_launcher.png"
          for d in android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp assets/icon.png "$d/ic_launcher.png" || true
            fi
          done
          ls android/app/src/main/res/mipmap-hdpi/ || true

      - name: Fix gal 2.3.3 - DIRECT PATH
        run: |
          GAL_FILE="/opt/hostedtoolcache/flutter/stable-3.22.0-x64/.pub-cache/hosted/pub.dev/gal-2.3.3/android/src/main/kotlin/com/gal/GalPlugin.kt"
          if [ -f "$GAL_FILE" ]; then
            sed -i 's/Registrar/FlutterPlugin/g' "$GAL_FILE" || true
            sed -i 's/Registrar/FlutterPlugin/g' "$GAL_FILE" || true
          fi
          echo "Gal fix done"

      - name: flutter build apk --release --split-per-abi
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
