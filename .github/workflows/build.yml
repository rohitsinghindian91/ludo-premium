name: Build APK FINAL BOTH FIXED - GAL + MAIN.DART

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AUTO FIX main.dart - FULL 2850 LINES CRASH FIX
        run: |
          echo "=== Fixing main.dart ==="
          # Fix late -> nullable
          sed -i 's/late SharedPreferences prefs;/SharedPreferences? prefs;/g' lib/main.dart
          sed -i 's/SharedPreferences prefs;/SharedPreferences? prefs;/g' lib/main.dart
          # Fix all prefs.
          sed -i 's/prefs\.getString/prefs?.getString/g' lib/main.dart
          sed -i 's/prefs\.setString/prefs?.setString/g' lib/main.dart
          sed -i 's/prefs\.getInt/prefs?.getInt/g' lib/main.dart
          sed -i 's/prefs\.setInt/prefs?.setInt/g' lib/main.dart
          sed -i 's/prefs\.getBool/prefs?.getBool/g' lib/main.dart
          sed -i 's/prefs\.setBool/prefs?.setBool/g' lib/main.dart
          sed -i 's/prefs\.clear/prefs?.clear/g' lib/main.dart
          sed -i 's/prefs\.remove/prefs?.remove/g' lib/main.dart
          sed -i 's/prefs!/prefs?/g' lib/main.dart
          # Fix ludoPrefs too
          sed -i 's/ludoPrefs\.setString/ludoPrefs?.setString/g' lib/main.dart
          sed -i 's/ludoPrefs\.getString/ludoPrefs?.getString/g' lib/main.dart
          sed -i 's/ludoPrefs!/ludoPrefs?/g' lib/main.dart
          # Make init safe
          sed -i 's/prefs = await SharedPreferences.getInstance();/try { prefs = await SharedPreferences.getInstance(); } catch(e) {}/g' lib/main.dart
          echo "main.dart fixed!"

      - name: Clean duplicate files
        run: |
          rm -rf android/app/src/main/kotlin/com/example
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/kotlin/com/ludo/premium/vludo_premium
          echo "cGFja2FnZSBjb20ubHVkby5wcmVtaXVtLnZsdWRvX3ByZW1pdW0KaW1wb3J0IGlvLmZsdXR0ZXIuZW1iZWRkaW5nLmFuZHJvaWQuRmx1dHRlckFjdGl2aXR5CmNsYXNzIE1haW5BY3Rpdml0eTogRmx1dHRlckFjdGl2aXR5KCkK" | base64 -d > android/app/src/main/kotlin/com/ludo/premium/vludo_premium/MainActivity.kt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      - name: Fix gal library - WORKING VERSION
        run: |
          GAL=$(find $HOME/.pub-cache -type d -name "gal-2.3.3" | head -1)
          echo "GAL=$GAL"
          if [ -d "$GAL" ]; then
            sed -i 's/Registrar/FlutterPlugin/g' $GAL/android/src/main/java/media/suvov/gal/GalPlugin.java || true
            echo "" | base64 -d > $GAL/android/build.gradle
            sed -i 's/package="studio.midoridesign.gal"//g' $GAL/android/src/main/AndroidManifest.xml
            echo "GAL fixed with WORKING version:"
            cat $GAL/android/build.gradle
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Premium-FIXED-FINAL
          path: build/app/outputs/flutter-apk/*.apk
