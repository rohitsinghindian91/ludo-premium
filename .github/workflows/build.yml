name: Build APK AUTO FIX ALL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 0. AUTO FIX ALL DART FILES - prefs? error
        run: |
          echo "Fixing ALL dart files automatically..."
          echo "Fixing prefs. -> prefs?. for ALL files in lib/"
          
          # Fix all prefs. usages in ALL dart files
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.setString/prefs?.setString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.getString/prefs?.getString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.getInt/prefs?.getInt/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.setInt/prefs?.setInt/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.getBool/prefs?.getBool/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.setBool/prefs?.setBool/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.clear/prefs?.clear/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.remove/prefs?.remove/g' {} \;
          
          # Fix ludoPrefs too (beautiful_ludo.dart)
          find lib -name "*.dart" -type f -exec sed -i 's/ludoPrefs\.setString/ludoPrefs?.setString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/ludoPrefs\.getString/ludoPrefs?.getString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/ludoPrefs\.getInt/ludoPrefs?.getInt/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/ludoPrefs\.setInt/ludoPrefs?.setInt/g' {} \;
          
          # Fix double ?? that might happen
          find lib -name "*.dart" -type f -exec sed -i 's/prefs?\?\.setString/prefs?.setString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs?\?\.getString/prefs?.getString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs?\?\.clear/prefs?.clear/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/ludoPrefs?\?\.setString/ludoPrefs?.setString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/ludoPrefs?\?\.getString/ludoPrefs?.getString/g' {} \;
          
          # Fix late SharedPreferences to nullable
          find lib -name "*.dart" -type f -exec sed -i 's/late SharedPreferences prefs;/SharedPreferences? prefs;/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/late SharedPreferences ludoPrefs;/SharedPreferences? ludoPrefs;/g' {} \;
          
          echo "Fixed ALL files:"
          grep -r "prefs?" lib --include="*.dart" | head -20
          echo "AUTO FIX DONE - All prefs errors fixed!"

      - name: 1. DELETE duplicate MainActivity
        run: |
          rm -rf android/app/src/main/kotlin/com/example
          echo "Cleaned"

      - name: 2. Ensure correct MainActivity exists
        run: |
          mkdir -p android/app/src/main/kotlin/com/ludo/premium/vludo_premium
          cat > android/app/src/main/kotlin/com/ludo/premium/vludo_premium/MainActivity.kt << 'EOF'
          package com.ludo.premium.vludo_premium
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF

      - name: 3. Fix icon crash
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          echo "Icon fixed"

      - name: 4. Fix gal 2.3.3
        run: |
          GAL_BASE=$(find $HOME/.pub-cache -type d -name "gal-2.3.3" | head -n 1)
          if [ ! -z "$GAL_BASE" ]; then
            sed -i 's/Registrar/FlutterPlugin/g' $GAL_BASE/android/src/main/java/media/suvov/gal/GalPlugin.java || true
            echo "Gal fixed"
          fi

      - name: 5. Check google-services.json
        run: |
          if [ -f "android/app/google-services.json" ]; then echo "✅ FOUND"; else echo "⚠️ NOT FOUND"; fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-AUTO-FIXED
          path: build/app/outputs/flutter-apk/*.apk
