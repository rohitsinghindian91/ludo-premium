name: Build APK - Final
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: false
      - run: flutter clean
      - run: flutter pub get
      - name: Fix gal plugin - namespace + sdk
        run: |
          FILE=$(find ~/.pub-cache -path "*/gal-2.3.3/android/build.gradle" | head -1)
          echo "Patching $FILE"
          cat > "$FILE" <<'EOF'
          group 'studio.midorii.gal'
          version '1.0'
          buildscript {
              ext.kotlin_version = '1.8.0'
              repositories { google(); mavenCentral() }
              dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
          }
          rootProject.allprojects { repositories { google(); mavenCentral() } }
          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'
          android {
              namespace 'studio.midorii.gal'
              compileSdkVersion 34
              defaultConfig { minSdkVersion 21 }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies { implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version" }
          EOF
          cat "$FILE"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
