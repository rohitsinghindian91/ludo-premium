name: Build Secure APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          
      - name: Get Packages
        run: flutter pub get
        
      - name: Build Secure Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=./symbols --no-tree-shake-icons
        
      - name: Upload Secure APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-secure-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 5