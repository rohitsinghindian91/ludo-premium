name: Build APK - ULTIMATE FINAL FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: 1. DELETE duplicate MainActivity (CRASH REASON)
        run: |
          echo "Checking duplicate folders..."
          ls -R android/app/src/main/kotlin/com/ || true
          echo "Deleting com/example - YEHI CRASH KARA RAHA HAI"
          rm -rf android/app/src/main/kotlin/com/example
          rm -rf android/app/src/main/kotlin/com/example/ludo_premium
          echo "After delete:"
          ls -R android/app/src/main/kotlin/com/ || true

      - name: 2. Ensure correct MainActivity exists
        run: |
          mkdir -p android/app/src/main/kotlin/com/ludo/premium/vludo_premium
          cat > android/app/src/main/kotlin/com/ludo/premium/vludo_premium/MainActivity.kt << 'EOF'
          package com.ludo.premium.vludo_premium

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          cat android/app/src/main/kotlin/com/ludo/premium/vludo_premium/MainActivity.kt

      - name: 3. Fix icon crash - delete broken xml
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          for d in android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp assets/icon.png "$d/ic_launcher.png" || true
              cp assets/icon.png "$d/ic_launcher_foreground.png" || true
            fi
          done

      - name: 4. Fix gal 2.3.3 - COMPLETE FIX with dependencies
        run: |
          GAL_BASE=$(find $HOME/.pub-cache -type d -name "gal-2.3.3" | head -n 1)
          echo "GAL_BASE: $GAL_BASE"
          GAL_FILE="$GAL_BASE/android/build.gradle"
          MANIFEST_FILE="$GAL_BASE/android/src/main/AndroidManifest.xml"
          cat > "$GAL_FILE" << 'EOF'
          group 'com.gal'
          version '1.0'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.0'
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'

          android {
              compileSdkVersion 34
              namespace "com.gal"

              defaultConfig {
                  minSdkVersion 21
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'org.apache.commons:commons-imaging:1.0-alpha3'
              implementation 'androidx.core:core:1.10.1'
              implementation 'androidx.annotation:annotation:1.6.0'
          }
          EOF
          
          cat > "$MANIFEST_FILE" << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          </manifest>
          EOF
          echo "Gal fixed"

      - name: 5. Check google-services.json
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ google-services.json FOUND"
          else
            echo "⚠️ WARNING: google-services.json NOT FOUND - Isse bhi crash ho sakta hai"
            echo "Firebase use kar raha hai to ye file android/app me hona chahiye"
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-ULTIMATE-FIXED
          path: build/app/outputs/flutter-apk/*.apk
