name: Build APK - FINAL FIXED

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CRASH PROOF Fix
        run: |
          git checkout lib/main.dart || true
          sed -i 's/late SharedPreferences prefs;/SharedPreferences? prefs;/' lib/main.dart
          sed -i 's/late final SharedPreferences prefs;/SharedPreferences? prefs;/' lib/main.dart
          sed -i 's/prefs\.getString/prefs?.getString/g' lib/main.dart
          sed -i 's/prefs\.setString/prefs?.setString/g' lib/main.dart
          sed -i 's/prefs\.clear/prefs?.clear/g' lib/main.dart
          sed -i 's/prefs\.getBool/prefs?.getBool/g' lib/main.dart
          sed -i 's/prefs\.getInt/prefs?.getInt/g' lib/main.dart
          sed -i 's/prefs\.setBool/prefs?.setBool/g' lib/main.dart
          sed -i 's/prefs\.setInt/prefs?.setInt/g' lib/main.dart
          sed -i 's/prefs\.remove/prefs?.remove/g' lib/main.dart
          echo "Prefs fixed"

      - name: Clean kotlin
        run: |
          rm -rf android/app/src/main/kotlin/com/example
          mkdir -p android/app/src/main/kotlin/com/ludo/premium/vludo_premium
          echo 'package com.ludo.premium.vludo_premium
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()' > android/app/src/main/kotlin/com/ludo/premium/vludo_premium/MainActivity.kt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pub get
        run: |
          flutter clean
          flutter pub get

      - name: Fix gal 2.3.3 - FINAL CORRECT
        run: |
          GAL=$(find $HOME/.pub-cache -name "gal-2.3.3" -type d | head -1)
          if [ -n "$GAL" ]; then
            echo "Fixing gal at $GAL"
            sed -i 's/Registrar/FlutterPlugin/g' $GAL/android/src/main/java/media/suvov/gal/GalPlugin.java || true
            cat > $GAL/android/build.gradle <<'GRADLE'
          group 'media.suvov.gal'
          version '1.0'
          
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          
          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          apply plugin: 'com.android.library'
          
          android {
              namespace 'media.suvov.gal'
              compileSdk 34
              defaultConfig {
                  minSdk 21
              }
          }
          GRADLE
            echo "gal fixed correctly"
            cat $GAL/android/build.gradle
          fi

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Premium-FINAL-FIXED
          path: build/app/outputs/flutter-apk/*.apk
