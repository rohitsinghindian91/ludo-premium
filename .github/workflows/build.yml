name: Build APK - Final
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter clean
      - run: flutter pub get
      - name: Fix gal 2.3.3 namespace
        run: |
          FILE=$(find /home/runner -name "build.gradle" -path "*gal-2.3.3*android*" 2>/dev/null | head -1)
          echo "Found $FILE"
          sed -i "s/namespace.*/namespace 'studio.midoridesign.gal'/" "$FILE" || echo "namespace 'studio.midoridesign.gal'" >> "$FILE"
          sed -i "s/package=\"studio.midoridesign.gal\"//g" $(find /home/runner -name "AndroidManifest.xml" -path "*gal*android*" 2>/dev/null | head -1) || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
