name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: flutter clean
        run: flutter clean

      - name: flutter pub get
        run: flutter pub get

      - name: Fix icon crash - delete broken xml
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
          for d in android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp assets/icon.png "$d/ic_launcher.png" || true
            fi
          done

      - name: Fix gal 2.3.3 - COMPLETE FIX (correct path)
        run: |
          GAL_FILE=$(find $HOME/.pub-cache -path "*gal-2.3.3/android/build.gradle" | head -n 1)
          echo "Found GAL_FILE: $GAL_FILE"
          if [ -z "$GAL_FILE" ]; then
            echo "GAL file not found, searching..."
            find $HOME/.pub-cache -name "build.gradle" | grep gal
            exit 1
          fi
          echo "Patching $GAL_FILE"
          cat > "$GAL_FILE" << 'EOF'
          group 'com.gal'
          version '1.0'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.0'
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'

          android {
              compileSdkVersion 34
              namespace "com.gal"

              defaultConfig {
                  minSdkVersion 21
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.mockito:mockito-core:5.0.0'
              androidTestImplementation 'androidx.test:runner:1.5.2'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
          }
          EOF
          echo "Gal fix done"

      - name: flutter build apk --release --split-per-abi
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
