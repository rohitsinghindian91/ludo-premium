name: Build APK - Fix Original Main.dart - Keep Admin Panel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FIX Original main.dart - Keep Full 2850 Lines - Only Crash Fix
        run: |
          # Always start from original git version to avoid double ?? bug
          git checkout lib/main.dart || true
          
          echo "Fixing original main.dart - keeping full code, only fixing crash..."
          
          # Fix 1: late -> nullable (only if still late)
          sed -i 's/late SharedPreferences prefs;/SharedPreferences? prefs;/' lib/main.dart
          sed -i 's/late final SharedPreferences prefs;/SharedPreferences? prefs;/' lib/main.dart
          
          # Fix 2: prefs. -> prefs?.  BUT only if not already ?.  Use trick to avoid double
          # First restore any double ?? from previous bad runs
          sed -i 's/prefs??\./prefs?. /g; s/prefs?\?\./prefs?. /g' lib/main.dart || true
          sed -i 's/prefs?\.\?\. /prefs?. /g' lib/main.dart || true
          # Now fix single . to ?. only where it's still .
          sed -i 's/prefs\.getString/prefs?.getString/g' lib/main.dart
          sed -i 's/prefs\.setString/prefs?.setString/g' lib/main.dart
          sed -i 's/prefs\.clear/prefs?.clear/g' lib/main.dart
          sed -i 's/prefs\.getBool/prefs?.getBool/g' lib/main.dart
          sed -i 's/prefs\.getInt/prefs?.getInt/g' lib/main.dart
          sed -i 's/prefs\.setBool/prefs?.setBool/g' lib/main.dart
          sed -i 's/prefs\.setInt/prefs?.setInt/g' lib/main.dart
          
          # Clean any accidental double ??
          sed -i 's/prefs??\./prefs?. /g' lib/main.dart || true
          sed -i 's/prefs?\.get/prefs?.get/g' lib/main.dart
          sed -i 's/prefs?\.set/prefs?.set/g' lib/main.dart
          sed -i 's/prefs?\.clear/prefs?.clear/g' lib/main.dart
          
          echo "Fixed! Checking..."
          grep -n "SharedPreferences" lib/main.dart | head -5
          echo "Lines: $(wc -l < lib/main.dart)"

      - name: Clean kotlin
        run: |
          rm -rf android/app/src/main/kotlin/com/example
          mkdir -p android/app/src/main/kotlin/com/ludo/premium/vludo_premium
          echo 'package com.ludo.premium.vludo_premium
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()' > android/app/src/main/kotlin/com/ludo/premium/vludo_premium/MainActivity.kt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      - name: Fix gal
        run: |
          GAL=$(find $HOME/.pub-cache -name "gal-2.3.3" -type d | head -1)
          if [ -n "$GAL" ]; then
            sed -i 's/Registrar/FlutterPlugin/g' $GAL/android/src/main/java/media/suvov/gal/GalPlugin.java || true
            printf "group 'media.suvov.gal'\nversion '1.0'\nandroid { namespace 'media.suvov.gal'; compileSdk 34; defaultConfig { minSdk 21 } }" > $GAL/android/build.gradle
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Premium-FULL-FIXED-Admin-Kept
          path: build/app/outputs/flutter-apk/*.apk
