name: Build APK - FINAL WORKING
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Run flutter clean
        run: flutter clean
      - name: Run flutter pub get
        run: flutter pub get
      - name: Fix gal 2.3.3 - FINAL WORKING
        run: |
          FILE=$(find ~/.pub-cache -name "build.gradle" -path "*gal-2.3.3*android*" | head -1)
          echo "Fixing $FILE"
          cat > "$FILE" << 'EOF'
          group 'studio.midoridesign.gal'
          version '1.0'

          buildscript {
              ext.kotlin_version = '1.9.10'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'

          android {
              namespace 'studio.midoridesign.gal'
              compileSdk 34
              ndkVersion "27.0.12077973"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  minSdk 21
              }
          }

          dependencies {
              implementation 'org.apache.commons:commons-imaging:1.0-alpha3'
              implementation 'androidx.exifinterface:exifinterface:1.3.6'
          }
          EOF
          cat "$FILE"
          MANIFEST=$(find ~/.pub-cache -name "AndroidManifest.xml" -path "*gal-2.3.3*android*" | head -1)
          sed -i 's/package="studio.midoridesign.gal"//g' "$MANIFEST" || true
      - name: Run flutter build apk --release
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
