name: Build APK - FIX ALL FILES FINAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      - name: FIX ALL DART FILES - prefs? crash (main.dart + voice_room.dart + all)
        run: |
          echo "Fixing ALL dart files..."
          
          # Fix main.dart - late -> nullable
          sed -i 's/late SharedPreferences prefs;/SharedPreferences? prefs;/' lib/main.dart
          
          # Fix ALL files in lib folder - setString, getString, clear, etc
          # Use find to fix every dart file
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.setString/prefs?.setString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.getString/prefs?.getString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.clear/prefs?.clear/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.getInt/prefs?.getInt/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.setInt/prefs?.setInt/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.getBool/prefs?.getBool/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\.setBool/prefs?.setBool/g' {} \;
          
          # Fix double ?? if any (prefs??.setString -> prefs?.setString)
          find lib -name "*.dart" -type f -exec sed -i 's/prefs?\.setString/prefs?.setString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\?\?\.setString/prefs?.setString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs?\.getString/prefs?.getString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\?\?\.getString/prefs?.getString/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs?\.clear/prefs?.clear/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i 's/prefs\?\?\.clear/prefs?.clear/g' {} \;
          
          # Fix substring(6) crash
          find lib -name "*.dart" -type f -exec sed -i 's/widget\.mobile\.substring(6)/widget.mobile.length >= 4 ? widget.mobile.substring(widget.mobile.length - 4) : widget.mobile/g' {} \;
          
          echo "✅ Fixed files:"
          grep -rn "prefs?" lib/*.dart | head -20

      - name: 1. DELETE duplicate MainActivity
        run: |
          rm -rf android/app/src/main/kotlin/com/example
          rm -rf android/app/src/main/kotlin/com/example/ludo_premium
          ls -R android/app/src/main/kotlin/com/ || echo "Cleaned"

      - name: 2. Ensure correct MainActivity exists
        run: |
          mkdir -p android/app/src/main/kotlin/com/ludo/premium/vludo_premium
          cat > android/app/src/main/kotlin/com/ludo/premium/vludo_premium/MainActivity.kt << 'EOF'
          package com.ludo.premium.vludo_premium
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF

      - name: 3. Fix icon crash
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml

      - name: 4. Fix gal 2.3.3
        run: |
          GAL_BASE=$(find $HOME/.pub-cache -type d -name "gal-2.3.3" | head -n 1)
          GAL_FILE="$GAL_BASE/android/build.gradle"
          MANIFEST_FILE="$GAL_BASE/android/src/main/AndroidManifest.xml"
          cat > "$GAL_FILE" << 'EOF'
          group 'com.gal'
          version '1.0'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.3.0' }
          }
          rootProject.allprojects { repositories { google(); mavenCentral() } }
          apply plugin: 'com.android.library'
          android {
              compileSdkVersion 34
              namespace "com.gal"
              defaultConfig { minSdkVersion 21; testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          dependencies {
              implementation 'org.apache.commons:commons-imaging:1.0-alpha3'
              implementation 'androidx.core:core:1.10.1'
              implementation 'androidx.annotation:annotation:1.6.0'
          }
          EOF
          cat > "$MANIFEST_FILE" << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          </manifest>
          EOF
          echo "Gal fixed"

      - name: 5. Check google-services.json
        run: |
          if [ -f "android/app/google-services.json" ]; then echo "✅ FOUND"; else echo "⚠️ NOT FOUND"; fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-FIXED-ALL-FILES
          path: build/app/outputs/flutter-apk/*.apk
