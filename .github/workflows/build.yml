name: Build APK - Final Fixed
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter clean
      - run: flutter pub get
      - name: Fix gal 2.3.3 namespace without deleting deps
        run: |
          FILE=$(find ~/.pub-cache -name "build.gradle" -path "*gal-2.3.3*android*" | head -1)
          MANIFEST=$(find ~/.pub-cache -name "AndroidManifest.xml" -path "*gal-2.3.3*android*" | head -1)
          echo "Found $FILE"
          cat "$FILE"
          # sirf compileSdk update karo, pura file mat udao
          sed -i "s/flutter.compileSdkVersion/34/g" "$FILE" || true
          sed -i "s/flutter.minSdkVersion/21/g" "$FILE" || true
          sed -i "s/flutter.targetSdkVersion/34/g" "$FILE" || true
          # namespace agar nahi hai toh add karo, hai toh chhod do
          if ! grep -q "namespace" "$FILE"; then
            sed -i "/^android {/a \    namespace 'studio.midoridesign.gal'" "$FILE"
          fi
          # manifest se package attribute hatao
          sed -i 's/package="studio.midoridesign.gal"//g' "$MANIFEST" || true
          echo "--- AFTER FIX ---"
          cat "$FILE"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
