name: ludo_premium
description: Ludo Premium - Online Ludo with Voice & Chat - FINAL v9 SECURE
publish_to: 'none'
version: 9.0.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  cloud_firestore: ^4.15.8
  firebase_database: ^10.4.0
  firebase_storage: ^11.6.0
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  share_plus: ^8.0.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  gal: ^2.3.1
  http: ^1.2.0
  image_cropper: ^5.0.1
  image: ^4.1.7
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon.png
    - assets/assistant.png

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#0A0E1A"
  image: assets/icon.png
  android: true
  ios: false
  android_12:
    color: "#0A0E1A"
    image: assets/icon.png
