<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><style>body{background:#111;color:#fff;font-family:Arial;padding:10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:8px;font-size:12px}button{padding:6px 10px;border:none;border-radius:5px} .on{background:green;color:white} .off{background:red;color:white}</style></head><body>
<h2>🎲 Premium Requests</h2>
<table id="tbl"></table>
<script>
const cfg={apiKey:"AIzaSyCwLEeS-TrsVabQT9rltt5dXN0-omR9qBc",authDomain:"ludo-premium-50-e427e.firebaseapp.com",projectId:"ludo-premium-50-e427e"};
firebase.initializeApp(cfg); const db=firebase.firestore();
function approve(docId,mobile){
  db.collection("premium_requests").doc(docId).update({status:"approved"});
  db.collection("users").doc(mobile).update({is_premium:true}).catch(()=>{db.collection("users").doc(mobile).set({is_premium:true,mobile:mobile},{merge:true})});
  alert(mobile+" Approved!");
}
function reject(docId,mobile){
  db.collection("premium_requests").doc(docId).update({status:"rejected"});
  db.collection("users").doc(mobile).update({is_premium:false});
}
db.collection("premium_requests").orderBy("time","desc").onSnapshot(s=>{
  let h='<tr><th>Mobile</th><th>Amount</th><th>UPI</th><th>Status</th><th>Action</th></tr>';
  s.forEach(d=>{
    let u=d.data(); let id=d.id;
    h+=`<tr><td>${u.mobile||id}</td><td>${u.amount||0}</td><td>${u.payToUpi||'-'}</td><td>${u.status}</td><td><button class="on" onclick="approve('${id}','${u.mobile}')">APPROVE</button> <button class="off" onclick="reject('${id}','${u.mobile}')">REJECT</button></td></tr>`;
  });
  document.getElementById('tbl').innerHTML=h;
});
</script></body></html>
