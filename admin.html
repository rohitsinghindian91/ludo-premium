<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUDO PREMIUM ADMIN</title>
<style>body{background:#0A0E1A;color:#fff;font-family:sans-serif;padding:10px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #333;padding:8px;font-size:12px;text-align:left}th{background:#1E293B;position:sticky;top:0}tr:nth-child(even){background:#151A2B}.premium{color:#22c55e;font-weight:bold}.free{color:#ef4444}.btn{padding:4px 8px;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:bold}.btn-true{background:#22c55e;color:#000}.btn-false{background:#ef4444;color:#fff}</style>
</head>
<body>
<h2>ADMIN - Latest Registration Uper ⬆️</h2>
<div>Total Users: <span id="total">0</span> | Premium: <span id="prem">0</span></div>
<table><thead><tr><th>#</th><th>Mobile</th><th>My Code</th><th>Joined With (Refer By)</th><th>Wallet</th><th>UPI</th><th>Premium</th><th>Joined At</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, Timestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3vGx...",
  authDomain: "ludo-premium-50-e427e.firebaseapp.com",
  projectId: "ludo-premium-50-e427e",
  storageBucket: "ludo-premium-50-e427e.appspot.com",
  messagingSenderId: "123",
  appId: "1:123:web:abc"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "<tr><td colspan=9>Loading...</td></tr>";
  try{
    const q = query(collection(db,"users"), orderBy("createdAt","desc"));
    let snap;
    try{ snap = await getDocs(q); }catch(e){ snap = await getDocs(collection(db,"users")); } // agar createdAt nahi hai to bina order ke
    let users = [];
    snap.forEach(d=> users.push({id:d.id, ...d.data()}));
    // Agar createdAt se order fail hua to client side sort latest uper
    users.sort((a,b)=>{
      const at = a.createdAt?.seconds || 0;
      const bt = b.createdAt?.seconds || 0;
      return bt - at;
    });
    let premCount = users.filter(u=>u.isPremium).length;
    document.getElementById("total").innerText = users.length;
    document.getElementById("prem").innerText = premCount;
    tbody.innerHTML = "";
    users.forEach((u,i)=>{
      const joined = u.referredBy ? u.referredBy : "Direct / No Refer";
      const created = u.createdAt ? new Date(u.createdAt.seconds*1000).toLocaleString() : "Old User";
      tbody.innerHTML += `<tr>
        <td>${i+1}</td>
        <td>${u.mobile || u.id}</td>
        <td><b style="color:#fbbf24">${u.referralCode || u.id}</b></td>
        <td><span style="color:${u.referredBy ? '#22c55e' : '#666'}">${joined}</span><br><small style="font-size:9px;color:#888">Lock - 1st time only</small></td>
        <td>₹${u.wallet || 0}</td>
        <td>${u.upi || '-'}</td>
        <td class="${u.isPremium?'premium':'free'}">${u.isPremium?'TRUE ✅':'FALSE ❌'}</td>
        <td>${created}</td>
        <td>
          <button class="btn btn-true" onclick="setPremium('${u.id}',true)">TRUE</button>
          <button class="btn btn-false" onclick="setPremium('${u.id}',false)">FALSE</button>
        </td>
      </tr>`;
    });
  }catch(e){ tbody.innerHTML = `<tr><td colspan=9>Error: ${e.message}</td></tr>`; }
}
window.setPremium = async (id, val)=>{
  const exp = new Date(); exp.setMonth(exp.getMonth()+1);
  await updateDoc(doc(db,"users",id), {isPremium: val, premiumExpiry: Timestamp.fromDate(exp), premiumDistributed: val?false:true});
  load();
}
load();
</script>
</body>
</html>
